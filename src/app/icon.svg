<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedb3" />
      <stop offset="35%" stop-color="#dfb96c" />
      <stop offset="70%" stop-color="#c9a96e" />
      <stop offset="100%" stop-color="#8c6a2c" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c9a96e" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="12" />

  <!-- Subtle glow layer behind S -->
  <path d="M330 110 L190 240 L280 240 L180 402 L320 272 L230 272 Z" fill="#dfb96c" opacity="0.25" filter="url(#glow)" />

  <!-- Geometric Luxury Lightning Bolt / S Icon -->
  <path d="M330 110 L190 240 L280 240 L180 402 L320 272 L230 272 Z" fill="url(#goldGrad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" />
</svg>
